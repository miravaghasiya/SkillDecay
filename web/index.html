  <meta charset="UTF-8">

    content="483787424425-t5kd4960oshbrfaitb6ihlb6itnvqveo.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <title>micro_skill_decay_detector</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script>
    (async function () {
      async function bootFlutter() {
        const script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.async = true;
        document.body.appendChild(script);
      }

      if (!('serviceWorker' in navigator)) {
        await bootFlutter();
        return;
      }

      try {
        const registration = await navigator.serviceWorker.register('firebase-messaging-sw.js');
        await navigator.serviceWorker.ready;
        console.log('FCM SW registered with scope:', registration.scope);
      } catch (e) {
        console.warn('FCM SW registration failed:', e);
      }

      await bootFlutter();
    })();
  </script>
</body>
